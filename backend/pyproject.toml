[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-learning-assistant"
version = "0.1.0"
description = "Turn a personal reading list into sourced, duration-bounded Chinese micro-lessons."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "sqlalchemy[asyncio]>=2.0.30,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "celery[redis]>=5.4,<6.0",
  "redis>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "trafilatura>=1.12,<2.0",
  "pypdf>=4.2,<7.0",
  "feedparser>=6.0,<7.0",
  "jieba>=0.42.1,<1.0",
  "langgraph>=0.2.30,<2.0",
  "pgvector>=0.3,<1.0",
  "argon2-cffi>=23.1,<26.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2.0"]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<2.0",
  "ruff>=0.5,<1.0",
  "asgi-lifespan>=2.1,<3.0",
]

[project.scripts]
ala-api = "app.main:run"
ala-dispatcher = "app.jobs.dispatcher:main"
ala-scheduler = "app.jobs.scheduler:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the async engine pool must not outlive the loop
# that created it (asyncpg connections are bound to their loop).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires a live PostgreSQL with pgvector"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "E402"]
