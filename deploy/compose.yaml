name: audio-learning

x-app: &app
  image: ${BACKEND_IMAGE:?Set an immutable backend image tag or digest}
  env_file: [.env]
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://ala:${POSTGRES_PASSWORD:?Set database password}@db:5432/ala
    REDIS_URL: redis://redis:6379/0
    APP_ENV: production
    COOKIE_SECURE: "true"
    SEED_DEMO_USER: "false"
    INLINE_WORKER: "false"
    STORAGE_DIR: /data/objects
    WORK_DIR: /data/work
    OFFLINE_FIXTURES_DIR: /app/evals/fixtures/web
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:size=128m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 512m
  cpus: 0.5
  networks: [data]
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
      POSTGRES_DB: ala
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.7
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ala -d ala]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "no", --save, "", --maxmemory, 96mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.2
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 12

  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    volumes: [objects:/data]
    networks: [data, app, egress]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6

  worker:
    <<: *app
    command: celery -A app.jobs.celery_app.celery_app worker -Q ala --concurrency 1 --loglevel=warning
    volumes: [objects:/data]
    networks: [data, egress]
    mem_limit: 1536m
    cpus: 1.3
    pids_limit: 256
    tmpfs: ["/tmp:size=256m,mode=1777"]

  dispatcher:
    <<: *app
    command: python -m app.jobs.dispatcher
    mem_limit: 256m
    cpus: 0.2

  scheduler:
    <<: *app
    command: python -m app.jobs.scheduler
    mem_limit: 256m
    cpus: 0.2

  web:
    image: ${WEB_IMAGE:?Set an immutable web image tag or digest}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.3
    pids_limit: 64
    ports: ["127.0.0.1:8091:8080"]
    networks: [app]
    depends_on:
      api: {condition: service_healthy}

  https:
    image: caddy:2-alpine
    # Host networking sends public traffic through UFW's INPUT rules.
    network_mode: host
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set the VPS public IP or hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.3
    pids_limit: 64
    depends_on: [web]

volumes:
  pgdata:
  objects:
  caddy_data:
  caddy_config:

networks:
  data:
    internal: true
  app:
    # The loopback web port requires a bridge with host port publishing enabled.
    # PostgreSQL and Redis remain exclusively on the internal data network.
  egress:
