# CI definition, kept out of .github/workflows so the repository can be pushed with a\n# token that has only 'repo' scope. To enable it:\n#   mkdir -p .github/workflows && cp deploy/github-actions-ci.yml .github/workflows/ci.yml\n# (the token must then include the 'workflow' scope).\nname: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ala
          POSTGRES_PASSWORD: ala
          POSTGRES_DB: ala_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ala -d ala_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ala:ala@localhost:5432/ala_test
      TEST_DATABASE_URL: postgresql+asyncpg://ala:ala@localhost:5432/ala_test
      PROVIDER_MODE: fake
      SEED_DEMO_USER: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Tests
        working-directory: backend
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: apps/web
        run: npm run build
