services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ala
      POSTGRES_PASSWORD: ala
      POSTGRES_DB: ala
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ala -d ala"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: alembic upgrade head
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ala:ala@db:5432/ala
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ala:ala@db:5432/ala
      REDIS_URL: redis://redis:6379/0
      OFFLINE_FIXTURES_DIR: /app/evals/fixtures/web
      STORAGE_DIR: /data/objects
      WORK_DIR: /data/work
      # A real dispatcher and worker exist in this topology; do not also run inline.
      INLINE_WORKER: "false"
    volumes:
      - objects:/data
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    networks: [internal, edge]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.jobs.celery_app.celery_app worker -Q ala --concurrency 2 --loglevel=info
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ala:ala@db:5432/ala
      REDIS_URL: redis://redis:6379/0
      OFFLINE_FIXTURES_DIR: /app/evals/fixtures/web
      STORAGE_DIR: /data/objects
      WORK_DIR: /data/work
      INLINE_WORKER: "false"
    volumes:
      - objects:/data
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal, edge]

  dispatcher:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.jobs.dispatcher
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ala:ala@db:5432/ala
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.jobs.scheduler
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ala:ala@db:5432/ala
      REDIS_URL: redis://redis:6379/0
      OFFLINE_FIXTURES_DIR: /app/evals/fixtures/web
    depends_on:
      migrate: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    depends_on: [api]
    ports: ["127.0.0.1:8080:8080"]
    networks: [edge]

volumes:
  pgdata:
  objects:

networks:
  internal:
    internal: true
  edge:
